name: Mixed-Grid key-bias development transform

on:
  push:
    branches:
      - mirror/mixed-grid-key-bias-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old fragment, found {count}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, repl):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, repl, text, count=1, flags=re.MULTILINE)
              if count == 0 and re.search(repl.replace('\\', '\\\\'), text):
                  return
              if count != 1:
                  raise SystemExit(f"{path}: regex expected exactly one match, found {count}: {pattern}")
              p.write_text(new_text)

          # CUDA producer: carry the already-supported exact-branch bias into
          # ksb while Q/K/V are still streamed in fused projection chunks.
          p = 'comfy_kitchen/backends/cuda/sage_attention/sol_attn_producer.cu'
          replace_once(p,
              '    const float* __restrict__ kmean,         // [H, HD] stale (may be zeros)\n'
              '    const float* __restrict__ vscale,        // [H, HD] stale V scale (may be ~0 -> margin)\n',
              '    const float* __restrict__ kmean,         // [H, HD] stale (may be zeros)\n'
              '    const float* __restrict__ vscale,        // [H, HD] stale V scale (may be ~0 -> margin)\n'
              '    const float* __restrict__ key_bias,      // [T] log2 key bias, or null\n')
          replace_once(p,
              '    quant_k_rows(sT, len, kmean + (size_t)h * HD, nullptr, kiP + dst0 * HD, ksb + dst0);',
              '    quant_k_rows(sT, len, kmean + (size_t)h * HD,\n'
              '                 key_bias ? key_bias + tb0 : nullptr, kiP + dst0 * HD, ksb + dst0);')
          replace_once(p,
              '    const void* kmean, const void* vscale,\n'
              '    void* qiP, void* qs, void* kiP, void* ksb, void* vTi, void* vRow, void* vcT,\n',
              '    const void* kmean, const void* vscale, const void* key_bias,\n'
              '    void* qiP, void* qs, void* kiP, void* ksb, void* vTi, void* vRow, void* vcT,\n')
          replace_once(p,
              '        (const float*)kmean, (const float*)vscale,\n'
              '        (int8_t*)qiP, (float*)qs, (int8_t*)kiP, (float2*)ksb,\n',
              '        (const float*)kmean, (const float*)vscale, (const float*)key_bias,\n'
              '        (int8_t*)qiP, (float*)qs, (int8_t*)kiP, (float2*)ksb,\n')

          p = 'comfy_kitchen/backends/cuda/sage_attention/sol_attn.cu'
          replace_once(p,
              'void launch_sol_producer(const void*, const void*, const void*, const void*,\n'
              '                         const void*, const void*, void*, void*, void*, void*,\n',
              'void launch_sol_producer(const void*, const void*, const void*, const void*,\n'
              '                         const void*, const void*, const void*, void*, void*, void*, void*,\n')
          replace_once(p,
              '    const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '    const void* blen, float rope_eps, int rot_dim, int t0, int M,\n',
              '    const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '    const void* key_bias, const void* blen, float rope_eps, int rot_dim, int t0, int M,\n')
          replace_once(p,
              '    launch_sol_producer(qkv, fab, qw, kw, kmean, vscale,\n'
              '                        w + p.qiP, w + p.qs, w + p.kiP, w + p.ksb,\n',
              '    launch_sol_producer(qkv, fab, qw, kw, kmean, vscale, key_bias,\n'
              '                        w + p.qiP, w + p.qs, w + p.kiP, w + p.ksb,\n')

          # CUDA nanobind: append an optional argument so old positional calls
          # retain their ABI. Validate dtype/layout before exposing a raw pointer.
          p = 'comfy_kitchen/backends/cuda/dlpack_bindings.cpp'
          replace_once(p,
              '        const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '        const void* blen, float rope_eps, int rot_dim, int t0, int M,\n',
              '        const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '        const void* key_bias, const void* blen, float rope_eps, int rot_dim, int t0, int M,\n')
          replace_once(p,
              '    std::optional<nb::ndarray<nb::device::cuda>> block_len = std::nullopt, int64_t token_aug = 0) {',
              '    std::optional<nb::ndarray<nb::device::cuda>> block_len = std::nullopt, int64_t token_aug = 0,\n'
              '    std::optional<nb::ndarray<nb::device::cuda>> key_bias = std::nullopt) {')
          replace_once(p,
              '    need_elems(vscale, batch * num_heads * 128, "sol_producer_chunk", "vscale");\n'
              '    sol_producer_chunk(workspace.data(), qkv.data(), fab.data(), qw.data(),\n'
              '                       kw.data(), kmean.data(), vscale.data(),\n'
              '                       block_len ? block_len->data() : nullptr,\n',
              '    need_elems(vscale, batch * num_heads * 128, "sol_producer_chunk", "vscale");\n'
              '    if (key_bias) {\n'
              '        if (key_bias->dtype() != nb::dtype<float>())\n'
              '            throw std::runtime_error("sol_producer_chunk: key_bias must be float32");\n'
              '        need_elems(*key_bias, batch * seq_len, "sol_producer_chunk", "key_bias");\n'
              '        need_contiguous(*key_bias, "sol_producer_chunk", "key_bias");\n'
              '    }\n'
              '    sol_producer_chunk(workspace.data(), qkv.data(), fab.data(), qw.data(),\n'
              '                       kw.data(), kmean.data(), vscale.data(),\n'
              '                       key_bias ? key_bias->data() : nullptr,\n'
              '                       block_len ? block_len->data() : nullptr,\n')
          replace_once(p,
              '          nb::arg("stream_ptr"), nb::arg("block_len") = nb::none(), nb::arg("token_aug") = 0);',
              '          nb::arg("stream_ptr"), nb::arg("block_len") = nb::none(), nb::arg("token_aug") = 0,\n'
              '          nb::arg("key_bias") = nb::none());')

          # CUDA Python API: normalize natural-log bias exactly as the direct
          # entry does, then feed the producer's exact carrier on every pass.
          p = 'comfy_kitchen/backends/cuda/__init__.py'
          replace_once(p,
              '    sink_blocks: list[int] | None = None,\n'
              '    sink_q: list[int] | None = None,\n'
              '    rope_eps: float = 1e-6,\n',
              '    sink_blocks: list[int] | None = None,\n'
              '    sink_q: list[int] | None = None,\n'
              '    key_bias: torch.Tensor | None = None,\n'
              '    rope_eps: float = 1e-6,\n')
          replace_once(p,
              '    width = 3 * h * d\n\n'
              '    def produce(km, vsc):\n',
              '    width = 3 * h * d\n'
              '    kb = None\n'
              '    if key_bias is not None:\n'
              '        # exact branch only, in log2 units; biased blocks must be sink-covered\n'
              '        kb = _normalize_key_bias(key_bias, 1, t, dev)\n'
              '        kb = (kb * _LOG2E).expand(1, t).contiguous()\n\n'
              '    def produce(km, vsc):\n')
          replace_once(p,
              '                block_len=None if block_len is None else _wrap_for_dlpack(block_len),\n'
              '                token_aug=int(token_aug))\n',
              '                block_len=None if block_len is None else _wrap_for_dlpack(block_len),\n'
              '                token_aug=int(token_aug),\n'
              '                key_bias=None if kb is None else _wrap_for_dlpack(kb))\n')
          replace_once(p,
              '    ``tail`` / ``block_len`` / ``coarse_gate`` / ``token_aug`` as in ``sol_attn``.\n\n'
              '    ``qkv_chunks``: an iterable of chunks or a zero-arg callable returning one.\n',
              '    ``tail`` / ``block_len`` / ``coarse_gate`` / ``token_aug`` as in ``sol_attn``.\n'
              '    ``key_bias`` is natural-log per-key score bias and is consumed only by\n'
              '    exact blocks; every biased key block must therefore be sink-routed.\n\n'
              '    ``qkv_chunks``: an iterable of chunks or a zero-arg callable returning one.\n')

          # HIP mirrors the same public contract and carrier semantics. No HIP
          # release claim is made by this transform; hardware validation remains separate.
          p = 'comfy_kitchen/backends/hip/sage_attention/sol_attn_producer.hip'
          replace_once(p,
              '    const float* __restrict__ kmean,   // [H, HD] stale (may be zeros)\n'
              '    const float* __restrict__ vscale,  // [H, HD] stale V scale\n',
              '    const float* __restrict__ kmean,   // [H, HD] stale (may be zeros)\n'
              '    const float* __restrict__ vscale,  // [H, HD] stale V scale\n'
              '    const float* __restrict__ key_bias,  // [T] log2 key bias, or null\n')
          replace_once(p,
              '    quant_k_rows(sT, len, kmean + static_cast<size_t>(h) * HD, nullptr, ki + dst0 * HD,\n'
              '                 ksb + dst0);',
              '    quant_k_rows(sT, len, kmean + static_cast<size_t>(h) * HD,\n'
              '                 key_bias ? key_bias + tb0 : nullptr, ki + dst0 * HD, ksb + dst0);')
          replace_once(p,
              'void launch_sol_producer(const void* qkv, const void* fab, const void* qw, const void* kw,\n'
              '                         const void* kmean, const void* vscale, void* qi, void* qs, void* ki,\n',
              'void launch_sol_producer(const void* qkv, const void* fab, const void* qw, const void* kw,\n'
              '                         const void* kmean, const void* vscale, const void* key_bias,\n'
              '                         void* qi, void* qs, void* ki,\n')
          replace_once(p,
              '        static_cast<const float*>(kmean), static_cast<const float*>(vscale),\n'
              '        static_cast<int8_t*>(qi), static_cast<float*>(qs), static_cast<int8_t*>(ki),\n',
              '        static_cast<const float*>(kmean), static_cast<const float*>(vscale),\n'
              '        static_cast<const float*>(key_bias), static_cast<int8_t*>(qi), static_cast<float*>(qs),\n'
              '        static_cast<int8_t*>(ki),\n')

          p = 'comfy_kitchen/backends/hip/sage_attention/sol_attn.hip'
          replace_once(p,
              'void launch_sol_producer(const void*, const void*, const void*, const void*, const void*,\n'
              '                         const void*, void*, void*, void*, void*, void*, void*, void*, void*,\n',
              'void launch_sol_producer(const void*, const void*, const void*, const void*, const void*,\n'
              '                         const void*, const void*, void*, void*, void*, void*, void*, void*, void*, void*,\n')
          replace_once(p,
              '    const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '    const void* blen, float rope_eps, int rot_dim, int t0, int M,\n',
              '    const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '    const void* key_bias, const void* blen, float rope_eps, int rot_dim, int t0, int M,\n')
          replace_once(p,
              '    launch_sol_producer(qkv, fab, qw, kw, kmean, vscale,\n',
              '    launch_sol_producer(qkv, fab, qw, kw, kmean, vscale, key_bias,\n')

          p = 'comfy_kitchen/backends/hip/dlpack_bindings.cpp'
          replace_once(p,
              '        const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '        const void* blen, float rope_eps, int rot_dim, int t0, int M,\n',
              '        const void* qw, const void* kw, const void* kmean, const void* vscale,\n'
              '        const void* key_bias, const void* blen, float rope_eps, int rot_dim, int t0, int M,\n')
          replace_once(p,
              '    std::optional<nb::ndarray<>> block_len = std::nullopt, int64_t token_aug = 0) {',
              '    std::optional<nb::ndarray<>> block_len = std::nullopt, int64_t token_aug = 0,\n'
              '    std::optional<nb::ndarray<>> key_bias = std::nullopt) {')
          replace_once(p,
              '    need_elems(vscale, batch * num_heads * 128, "sol_producer_chunk", "vscale");\n'
              '    sol_producer_chunk(workspace.data(), qkv.data(), fab.data(), qw.data(),\n'
              '                       kw.data(), kmean.data(), vscale.data(),\n'
              '                       block_len ? block_len->data() : nullptr,\n',
              '    need_elems(vscale, batch * num_heads * 128, "sol_producer_chunk", "vscale");\n'
              '    if (key_bias) {\n'
              '        if (map_dtype_to_code(key_bias->dtype()) != 0)\n'
              '            throw std::runtime_error("sol_producer_chunk: key_bias must be float32");\n'
              '        need_elems(*key_bias, batch * seq_len, "sol_producer_chunk", "key_bias");\n'
              '        need_contiguous(*key_bias, "sol_producer_chunk", "key_bias");\n'
              '    }\n'
              '    sol_producer_chunk(workspace.data(), qkv.data(), fab.data(), qw.data(),\n'
              '                       kw.data(), kmean.data(), vscale.data(),\n'
              '                       key_bias ? key_bias->data() : nullptr,\n'
              '                       block_len ? block_len->data() : nullptr,\n')
          replace_once(p,
              '          nb::arg("stream_ptr"), nb::arg("block_len") = nb::none(),\n'
              '          nb::arg("token_aug") = 0);',
              '          nb::arg("stream_ptr"), nb::arg("block_len") = nb::none(),\n'
              '          nb::arg("token_aug") = 0, nb::arg("key_bias") = nb::none());')

          p = 'comfy_kitchen/backends/hip/__init__.py'
          replace_once(p,
              '    sink_blocks: list[int] | None = None,\n'
              '    sink_q: list[int] | None = None,\n'
              '    rope_eps: float = 1e-6,\n',
              '    sink_blocks: list[int] | None = None,\n'
              '    sink_q: list[int] | None = None,\n'
              '    key_bias: torch.Tensor | None = None,\n'
              '    rope_eps: float = 1e-6,\n')
          replace_once(p,
              '    width = 3 * h * d\n\n'
              '    def produce(km, vsc):\n',
              '    width = 3 * h * d\n'
              '    kb = None\n'
              '    if key_bias is not None:\n'
              '        # exact branch only, in log2 units; biased blocks must be sink-covered\n'
              '        kb = _normalize_key_bias(key_bias, 1, t, dev)\n'
              '        kb = (kb * _LOG2E).expand(1, t).contiguous()\n\n'
              '    def produce(km, vsc):\n')
          replace_once(p,
              '                block_len=None if block_len is None else _dl(block_len),\n'
              '                token_aug=int(token_aug))\n',
              '                block_len=None if block_len is None else _dl(block_len),\n'
              '                token_aug=int(token_aug), key_bias=None if kb is None else _dl(kb))\n')
          replace_once(p,
              '    ``tail`` / ``block_len`` / ``coarse_gate`` / ``token_aug`` as in ``sol_attn``.\n\n'
              '    ``qkv_chunks``: an iterable of chunks or a zero-arg callable returning one.\n',
              '    ``tail`` / ``block_len`` / ``coarse_gate`` / ``token_aug`` as in ``sol_attn``.\n'
              '    ``key_bias`` is natural-log per-key score bias and is consumed only by\n'
              '    exact blocks; every biased key block must therefore be sink-routed.\n\n'
              '    ``qkv_chunks``: an iterable of chunks or a zero-arg callable returning one.\n')

          # Shared GPU contract tests exercise both compiled backends through the
          # same public function. They intentionally force the weighted interval
          # exact while leaving the rest on the established sparse/tail path.
          p = 'tests/test_sol_attn.py'
          anchor = '''def test_chunked_producer_matches_separate_rope(rot):\n    """Chunked producer vs rms_rope_split_half_ + sol_attn. rot=96 is H3's real\n'''
          if 'def test_chunked_key_bias_matches_separate_rope()' not in Path(p).read_text():
              insert = '''def test_chunked_key_bias_matches_separate_rope():\n    """Chunked fused-QKV must carry natural-log key bias into its exact K blocks.\n\n    The weighted interval is fully sink-routed while the rest of the sequence\n    retains the ordinary sparse/tail route, matching the production contract.\n    """\n    c = _chunked_case(seed=23, rot=96, v_scale=0.02)\n    bias = torch.zeros(c["t"], device="cuda")\n    bias[64:192] = math.log(0.37)\n    sinks = [1, 3]\n    ref = backend.sol_attn(\n        c["q"], c["k"], c["v"], tau=1.4, key_bias=bias, sink_blocks=sinks\n    )\n    got, _, _ = backend.sol_attn_chunked(\n        c["chunks"], c["t"], c["h"], c["freqs"], c["norm"],\n        tau=1.4, key_bias=bias, sink_blocks=sinks\n    )\n    plain, _, _ = backend.sol_attn_chunked(\n        c["chunks"], c["t"], c["h"], c["freqs"], c["norm"],\n        tau=1.4, sink_blocks=sinks\n    )\n    assert _cos(got, ref) > 0.995\n    assert not torch.equal(got, plain)\n\n\ndef test_chunked_key_bias_validation_matches_direct_path():\n    c = _chunked_case(seed=29, rot=96, v_scale=0.02)\n    with pytest.raises(ValueError, match="key_bias"):\n        backend.sol_attn_chunked(\n            c["chunks"], c["t"], c["h"], c["freqs"], c["norm"],\n            key_bias=torch.zeros(c["t"] - 1, device="cuda"), sink_blocks=[0, 1]\n        )\n\n\n'''
              text = Path(p).read_text()
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'{p}: chunked test insertion anchor not found')
              Path(p).write_text(text[:pos] + insert + text[pos:])
          PY
      - name: Static validation
        shell: bash
        run: |
          python -m py_compile comfy_kitchen/backends/cuda/__init__.py comfy_kitchen/backends/hip/__init__.py tests/test_sol_attn.py
          git diff --check
          git diff --exit-code -- . ':(exclude).github/workflows/mixed-grid-key-bias-dev.yml' >/dev/null && exit 0 || true
      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet -- . ':(exclude).github/workflows/mixed-grid-key-bias-dev.yml'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comfy_kitchen/backends/cuda/__init__.py \
                  comfy_kitchen/backends/cuda/dlpack_bindings.cpp \
                  comfy_kitchen/backends/cuda/sage_attention/sol_attn.cu \
                  comfy_kitchen/backends/cuda/sage_attention/sol_attn_producer.cu \
                  comfy_kitchen/backends/hip/__init__.py \
                  comfy_kitchen/backends/hip/dlpack_bindings.cpp \
                  comfy_kitchen/backends/hip/sage_attention/sol_attn.hip \
                  comfy_kitchen/backends/hip/sage_attention/sol_attn_producer.hip \
                  tests/test_sol_attn.py
          git commit -m 'Add key bias to chunked Sol-Attn producer'
          git push origin HEAD:mirror/mixed-grid-key-bias-20260910
