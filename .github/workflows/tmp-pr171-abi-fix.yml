name: tmp-pr171-abi-fix

on:
  push:
    branches:
      - mirror/pr171-hostile-review-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr171-hostile-review-20260911

      - name: Preserve public chunked positional ABI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '''    sink_blocks: list[int] | None = None,\n    sink_q: list[int] | None = None,\n    key_bias: torch.Tensor | None = None,\n    rope_eps: float = 1e-6,\n    tail: bool = True,\n    block_len: torch.Tensor | None = None,\n    coarse_gate: torch.Tensor | None = None,\n    token_aug: int = 0,\n'''
          new = '''    sink_blocks: list[int] | None = None,\n    sink_q: list[int] | None = None,\n    rope_eps: float = 1e-6,\n    tail: bool = True,\n    block_len: torch.Tensor | None = None,\n    coarse_gate: torch.Tensor | None = None,\n    token_aug: int = 0,\n    key_bias: torch.Tensor | None = None,\n'''

          for name in (
              'comfy_kitchen/backends/cuda/__init__.py',
              'comfy_kitchen/backends/hip/__init__.py',
          ):
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one vulnerable signature, found {count}')
              path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_sol_attn_chunked_api.py')
          test.write_text('''from __future__ import annotations\n\nimport ast\nfrom pathlib import Path\n\n\n_LEGACY_TAIL = [\n    "rope_eps",\n    "tail",\n    "block_len",\n    "coarse_gate",\n    "token_aug",\n]\n\n\ndef _chunked_parameters(path: str) -> list[str]:\n    tree = ast.parse(Path(path).read_text())\n    matches = [\n        node\n        for node in tree.body\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))\n        and node.name == "sol_attn_chunked"\n    ]\n    assert len(matches) == 1\n    fn = matches[0]\n    return [arg.arg for arg in (*fn.args.posonlyargs, *fn.args.args)]\n\n\ndef test_chunked_key_bias_is_appended_after_legacy_positional_tail():\n    for path in (\n        "comfy_kitchen/backends/cuda/__init__.py",\n        "comfy_kitchen/backends/hip/__init__.py",\n    ):\n        params = _chunked_parameters(path)\n        assert params[-6:] == [*_LEGACY_TAIL, "key_bias"]\n''')
          PY

      - name: Validate edited Python sources
        run: |
          python -m compileall -q \
            comfy_kitchen/backends/cuda/__init__.py \
            comfy_kitchen/backends/hip/__init__.py \
            tests/test_sol_attn_chunked_api.py
          python -m pytest -q tests/test_sol_attn_chunked_api.py
          git diff --check

      - name: Commit mirror fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            comfy_kitchen/backends/cuda/__init__.py \
            comfy_kitchen/backends/hip/__init__.py \
            tests/test_sol_attn_chunked_api.py
          git commit -m 'Preserve sol_attn_chunked positional API'
          git push origin HEAD:mirror/pr171-hostile-review-20260911
